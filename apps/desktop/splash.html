<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAYO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Times New Roman', Times, serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Phase 1: KAYO text fade in */
    .kayo-text {
      font-size: 10rem;
      font-weight: bold;
      background: linear-gradient(to bottom, rgba(255, 0, 0, 1) 0%, rgba(255, 0, 0, 0.2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      animation: fadeInText 2s ease forwards;
      position: relative;
    }

    .kayo-subtitle {
      position: absolute;
      top: 55%;
      left: 0;
      width: 100%;
      height: 2.5rem;
      background: #000;
      z-index: 1;
      opacity: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      text-align: center;
      animation: slideSubtitle 4s cubic-bezier(.68, -0.55, .27, 1.55) 1s forwards;
    }

    .kayo-subtitle span {
      background: linear-gradient(135deg, #ff4444, #ff9600);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Phase 2: Logo spin in */
    .logo-container {
      position: absolute;
      width: 200px;
      height: 200px;
      opacity: 0;
      transform: scale(0) rotate(-180deg);
      animation: logoAppear 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) 4.5s forwards;
    }

    .logo-container.spinning {
      animation: logoAppear 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) 4.5s forwards,
                 logoSpin 3s linear infinite 5.3s;
    }

    .logo-container svg {
      width: 100%;
      height: 100%;
    }

    /* Phase 3: Loading bar */
    .loading-section {
      position: absolute;
      bottom: -120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      animation: fadeIn 0.5s ease 5.5s forwards;
    }

    .loading-bar-track {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4444, #ff9600);
      border-radius: 2px;
      animation: loadProgress 4s ease 5.8s forwards;
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
    }

    .loading-text {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(3) infinite 5.5s;
    }

    /* Text converge and fade out */
    .splash-container.phase-logo .kayo-text {
      animation: textConverge 0.5s ease 4s forwards;
    }
    .splash-container.phase-logo .kayo-subtitle {
      animation: slideSubtitle 4s cubic-bezier(.68, -0.55, .27, 1.55) 1s forwards,
                 textConverge 0.5s ease 4s forwards;
    }

    @keyframes fadeInText {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideSubtitle {
      0% { left: 0; opacity: 0; }
      80% { opacity: 1; }
      100% { left: 100%; transform: translateX(-100%); opacity: 1; }
    }

    @keyframes textConverge {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.3); }
    }

    @keyframes logoAppear {
      0% { opacity: 0; transform: scale(0) rotate(-180deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes logoSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes loadProgress {
      0% { width: 0%; }
      20% { width: 25%; }
      50% { width: 55%; }
      80% { width: 85%; }
      100% { width: 100%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes dots {
      0% { content: ''; }
      33% { content: '.'; }
      66% { content: '..'; }
      100% { content: '...'; }
    }

    /* Final fade out */
    .splash-container.fade-out {
      animation: fadeOutAll 0.6s ease forwards;
    }

    @keyframes fadeOutAll {
      to { opacity: 0; transform: scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="splash-container phase-logo" id="splashContainer">
    <!-- Phase 1: Text -->
    <div class="kayo-text">
      KAYO
      <div class="kayo-subtitle">
        <span>Security Lifecycle Platform</span>
      </div>
    </div>

    <!-- Phase 2: Logo -->
    <div class="logo-container spinning">
      <svg viewBox="0 0 500 500">
        <path fill="#ff0000" d="M261.091888,391.127258 C321.260071,351.606262 345.399597,295.680725 338.323944,224.184998 C375.040466,258.539185 390.511200,299.665741 382.803680,348.752899 C374.579498,401.130432 333.506927,445.125366 280.488525,456.542267 C229.133804,467.600952 185.386078,452.335266 148.833405,413.244659 C189.318420,418.516663 226.484344,412.068542 261.091888,391.127258z"/>
        <path fill="#ff0000" d="M197.850098,331.208954 C223.747833,340.064545 249.880417,341.906036 276.461121,338.360321 C265.031372,363.466034 205.248749,387.926239 165.794724,384.749390 C108.736534,380.155090 58.273186,338.433228 45.268444,281.044617 C32.847763,226.233398 56.284939,175.765244 88.442001,150.219238 C75.942963,240.722992 132.691742,309.689026 197.850098,331.208954z"/>
        <path fill="#ff0000" d="M117.959267,160.029419 C125.241768,99.977211 171.482941,52.179447 230.816788,43.190086 C281.856415,35.457344 330.043793,59.761002 350.984222,88.500847 C296.543304,81.692787 248.792282,96.163452 209.826309,135.189194 C170.795471,174.279907 156.733246,222.203720 163.817123,277.684814 C129.183121,245.452103 113.344429,206.977158 117.959267,160.029419z"/>
        <path fill="#ff0000" d="M435.713501,174.305038 C475.662903,232.834366 463.703369,308.998322 413.170044,352.237061 C420.037140,297.266205 405.826019,249.259460 366.782318,210.127106 C327.738953,170.995102 279.860962,156.744736 225.464310,163.465439 C270.090332,107.143478 375.414886,92.405128 435.713501,174.305038z"/>
      </svg>
    </div>

    <!-- Phase 3: Loading -->
    <div class="loading-section">
      <div class="loading-bar-track">
        <div class="loading-bar-fill"></div>
      </div>
      <div class="loading-text">
        <span>INITIALIZING</span><span class="loading-dots"></span>
      </div>
    </div>
  </div>

  <script>
    // Signal to main process when loading is complete
    // The splash will show for ~10s (animation timeline), then signal ready
    setTimeout(() => {
      if (window.electronAPI && window.electronAPI.splashReady) {
        window.electronAPI.splashReady();
      }
    }, 9500);
  </script>
</body>
</html>
