version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    ECR_REPO_NAME: "kayo-projects"

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - yum install -y git 2>/dev/null || apt-get install -y git 2>/dev/null || true

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI
      - aws ecr describe-repositories --repository-names $ECR_REPO_NAME --region $AWS_DEFAULT_REGION 2>/dev/null || aws ecr create-repository --repository-name $ECR_REPO_NAME --region $AWS_DEFAULT_REGION
      - echo "Cloning repo $REPO_URL..."
      - git clone $REPO_URL /tmp/repo
      - cd /tmp/repo

  build:
    commands:
      - cd /tmp/repo
      - IMAGE_TAG=$PROJECT_ID
      - ECR_URI=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO_NAME
      - |
        if [ ! -f Dockerfile ]; then
          echo "No Dockerfile found, generating one..."
          if [ -f package.json ]; then
            cat > Dockerfile << 'EOF'
FROM node:18-alpine
WORKDIR /app
COPY package*.json ./
RUN npm install --production
COPY . .
RUN npm run build 2>/dev/null || true
EXPOSE 3000
CMD ["npm", "start"]
EOF
          elif [ -f requirements.txt ]; then
            cat > Dockerfile << 'EOF'
FROM python:3.11-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install -r requirements.txt
COPY . .
EXPOSE 8000
CMD ["python", "app.py"]
EOF
          else
            cat > Dockerfile << 'EOF'
FROM nginx:alpine
COPY . /usr/share/nginx/html
EXPOSE 80
CMD ["nginx", "-g", "daemon off;"]
EOF
          fi
        fi
      - docker build -t $ECR_URI:$IMAGE_TAG .
      - docker push $ECR_URI:$IMAGE_TAG
      - echo "IMAGE_URI=$ECR_URI:$IMAGE_TAG" > /tmp/image_uri.txt

  post_build:
    commands:
      - IMAGE_URI=$(cat /tmp/image_uri.txt | cut -d= -f2)
      - echo "Image built and pushed: $IMAGE_URI"
      - STACK_NAME=kayo-project-$PROJECT_ID
      - PORT_NUM=${PORT:-3000}
      - TEMPLATE_URL=https://s3.amazonaws.com/kayo-artifacts-700640308663/cloudformation/project-stack-template.yaml
      - |
        if aws cloudformation describe-stacks --stack-name $STACK_NAME --region $AWS_DEFAULT_REGION 2>/dev/null; then
          echo "Updating existing stack..."
          aws cloudformation update-stack \
            --stack-name $STACK_NAME \
            --template-url $TEMPLATE_URL \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters \
              ParameterKey=ProjectId,ParameterValue=$PROJECT_ID \
              ParameterKey=ProjectName,ParameterValue="$PROJECT_NAME" \
              ParameterKey=ImageUri,ParameterValue=$IMAGE_URI \
              ParameterKey=ContainerPort,ParameterValue=$PORT_NUM \
            --region $AWS_DEFAULT_REGION 2>&1 || echo "No changes to deploy"
        else
          echo "Creating new stack..."
          aws cloudformation create-stack \
            --stack-name $STACK_NAME \
            --template-url $TEMPLATE_URL \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters \
              ParameterKey=ProjectId,ParameterValue=$PROJECT_ID \
              ParameterKey=ProjectName,ParameterValue="$PROJECT_NAME" \
              ParameterKey=ImageUri,ParameterValue=$IMAGE_URI \
              ParameterKey=ContainerPort,ParameterValue=$PORT_NUM \
            --region $AWS_DEFAULT_REGION
        fi
      - echo "Waiting for stack to complete..."
      - aws cloudformation wait stack-create-complete --stack-name $STACK_NAME --region $AWS_DEFAULT_REGION 2>/dev/null || aws cloudformation wait stack-update-complete --stack-name $STACK_NAME --region $AWS_DEFAULT_REGION 2>/dev/null || true
      - APP_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --region $AWS_DEFAULT_REGION --query "Stacks[0].Outputs[?OutputKey=='AppURL'].OutputValue" --output text 2>/dev/null || echo "")
      - echo "APP_URL=$APP_URL"
      - |
        if [ -n "$APP_URL" ] && [ -n "$CALLBACK_URL" ]; then
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -d "{\"project_id\":\"$PROJECT_ID\",\"status\":\"active\",\"app_url\":\"$APP_URL\"}" || true
        fi
