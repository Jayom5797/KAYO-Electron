version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════════
# KAYO E2E Test Environment
# 
# Starts all services required for end-to-end lifecycle validation.
# Usage: docker compose -f docker-compose.e2e.yml up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: kayo-e2e-postgres
    environment:
      POSTGRES_DB: kayo_e2e
      POSTGRES_USER: kayo
      POSTGRES_PASSWORD: kayo_e2e_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kayo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: kayo-e2e-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kayo-e2e-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kayo-e2e-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: kayo-e2e-clickhouse
    ports:
      - "8123:8123"
      - "9001:9000"
    environment:
      CLICKHOUSE_DB: kayo_events
      CLICKHOUSE_USER: kayo
      CLICKHOUSE_PASSWORD: kayo_e2e_password
    volumes:
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.15-community
    container_name: kayo-e2e-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/kayo_e2e_password
      NEO4J_dbms_memory_heap_max__size: 512M
      NEO4J_dbms_memory_pagecache_size: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Application Services ────────────────────────────────────────────────────

  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    container_name: kayo-e2e-control-plane
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kayo:kayo_e2e_password@postgres:5432/kayo_e2e
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: kayo_e2e_password
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DATABASE: kayo_events
      CLICKHOUSE_USER: kayo
      CLICKHOUSE_PASSWORD: kayo_e2e_password
      SECRET_KEY: kayo-e2e-test-secret-key
      DEBUG: "true"
      K8S_IN_CLUSTER: "false"
      ASSESSMENT_ENGINE_URL: http://assessment-engine:3100
      MONITOR_SERVICE_URL: http://monitor-service:8002
      SERVICE_TOKEN: kayo-e2e-service-token
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  assessment-engine:
    build:
      context: ./services/assessment-engine
      dockerfile: Dockerfile
    container_name: kayo-e2e-assessment
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"
      KAYO_SERVICE_TOKEN: kayo-e2e-service-token
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  monitor-service:
    build:
      context: ./services/monitor-service
      dockerfile: Dockerfile
    container_name: kayo-e2e-monitor
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
      KAYO_SERVICE_TOKEN: kayo-e2e-service-token
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  telemetry-ingestion:
    build:
      context: ./services/telemetry-ingestion
      dockerfile: Dockerfile
    container_name: kayo-e2e-telemetry
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: telemetry-ingestion-e2e
      KAFKA_TOPIC_PATTERN: "telemetry\\..*"
      KAFKA_AUTO_OFFSET_RESET: earliest
      KAFKA_ENABLE_AUTO_COMMIT: "false"
      KAFKA_MAX_POLL_RECORDS: "100"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DATABASE: kayo_events
      CLICKHOUSE_USER: kayo
      CLICKHOUSE_PASSWORD: kayo_e2e_password
      LOG_LEVEL: INFO

  graph-engine:
    build:
      context: ./services/graph-engine
      dockerfile: Dockerfile
    container_name: kayo-e2e-graph
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: graph-engine-e2e
      KAFKA_TOPIC_PATTERN: "telemetry\\..*"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_ADMIN_USER: neo4j
      NEO4J_ADMIN_PASSWORD: kayo_e2e_password
      DATABASE_URL: postgresql://kayo:kayo_e2e_password@postgres:5432/kayo_e2e
      LOG_LEVEL: INFO

  detection-engine:
    build:
      context: ./services/detection-engine
      dockerfile: Dockerfile
    container_name: kayo-e2e-detection
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_ADMIN_USER: neo4j
      NEO4J_ADMIN_PASSWORD: kayo_e2e_password
      DATABASE_URL: postgresql://kayo:kayo_e2e_password@postgres:5432/kayo_e2e
      LOOKBACK_WINDOW: "3600"
      RULES_DIRECTORY: rules
      LOG_LEVEL: INFO
    command: ["python", "event_driven_detector.py"]

networks:
  default:
    name: kayo-e2e-network
